[package]
name = "async-request-queue-challenge"
version = "0.1.0"
edition = "2024"
description = "An actor-style async request queue built with Tokio channels"
authors = [" <>"]
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
cargo_common_metadata = { level = "allow", priority = 1 }

[lints.rust]
unsafe_code = "forbid"
